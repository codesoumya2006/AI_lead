services:
  api:
    build: ./backend
    environment:
      ENVIRONMENT: local
      AUTH_MODE: dev
      DATA_DIR: /data
      PORT: 8080
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports: ["8000:8080"]
    volumes: ["lead_data:/data"]
  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports: ["5173:8080"]
    depends_on: [api]
volumes:
  lead_data:
